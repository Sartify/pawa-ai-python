[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pawa-ai"
version = "0.2.0"
description = "Official Python SDK for the Pawa AI API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Sartify Company Limited", email = "hello@sartify.co.tz" },
]
keywords = ["pawa-ai", "ai", "llm", "africa", "sdk", "chat", "embeddings"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "build>=1.0.0",
]

[project.urls]
Homepage = "https://pawa-ai.com"
Documentation = "https://docs.pawa-ai.com"
Repository = "https://github.com/Sartify/pawa-ai-python"
Issues = "https://github.com/Sartify/pawa-ai-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pawa_ai"]

[tool.hatch.build.targets.sdist]
include = ["src/pawa_ai", "README.md", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
